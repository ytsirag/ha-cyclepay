[project]
name = "ha-cyclepay"
version = "0.1.8"
description = "Home Assistant custom integration for CyclePay (ESD/Hercules) laundry rooms"
requires-python = ">=3.12"
dependencies = [
    "pylaundry>=0.1.5",
]

[dependency-groups]
dev = [
    "homeassistant>=2024.1",
    "pre-commit>=3.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Installs the custom_components/cyclepay package into the wheel.
packages = ["custom_components/cyclepay"]

[tool.black]
line-length = 115
target-version = ["py312"]
exclude = 'generated'
preview = "True"

[tool.mypy]
python_version = "3.12"
show_error_codes = true
ignore_missing_imports = true
color_output = true
strict_equality = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_decorators = false # @pytest.mark.asyncio is untyped
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unreachable = true
pretty = true
show_absolute_path = true
show_error_context = true
disallow_untyped_calls = false
exclude = ["tests/", "build/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", "testing_config"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
unfixable = [
  "F841" # Unused variables
]
exclude = ["examples", "tests", "pylint", "build"]
select = [
  "B007", # Loop control variable {name} not used within loop body
  "B014", # Exception handler with duplicate exception
  "C", # complexity
  "D", # docstrings
  "E", # pycodestyle
  "F", # pyflakes/autoflake
  "I", # isort
  "PL", # pylint
  "RUF", # ruff-specific
  "TID", # flake-8 tidy imports
  "SLF", # flake-8 self
  "SIM", # flake-8 simplify
  "ICN001", # import conventions; {name} should be imported as {asname}
  "PGH004", # Use specific rule codes when using noqa
  "PLC0414", # Useless import alias
  "RET", # flake-8 return
  "S", # Bandit
  "T20", # flake8-print
  "TRY", # tryceratops
  "UP", # pyupgrade
  "W" # pycodestyle
]
ignore = [
  "D202", # No blank lines allowed after function docstring
  "D203", # 1 blank line required before class docstring
  "D213", # Multi-line docstring summary should start at the second line
  "D404", # First word of the docstring should not be This
  "D406", # Section name should end with a newline
  "D407", # Section name underlining
  "D411", # Missing blank line before section
  "E501", # line too long
  "E731", # do not assign a lambda expression, use a def
  "TRY003", # Avoid messages outside of the Exception class
  "PLR0912", # Too many branches
  "PLR0915", # Too many statements
  "PLR0913", # Too many arguments in a function call
  "PLR2004", # Magic values
  "PLR0911", # Too many return statements
  "TRY301", # Avoid raising within a try block
  "UP006", # keep-runtime-typing (with UP007)
  "UP007"
]

[tool.ruff.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.mccabe]
max-complexity = 25

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]

[tool.tomlsort]
all = false
check = false
ignore_case = true
in_place = true
no_header = false
